[package]
name = "torrent-escrow"
description = "Torrent fully-funded payout-rights escrow (Soroban). Testnet/synthetic only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "=1.12.0"
